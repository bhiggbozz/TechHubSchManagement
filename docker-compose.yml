services:
  techhub-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: techhub-api:latest
    container_name: techhub-api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Production

      # ── Database (remote SQL Server) ────────────────────────────────────────
      # REQUIRED: set in .env. Empty default = must be provided via env.
      ConnectionStrings__DbConnectionString: ${DB_CONNECTION_STRING:-}
      ConnectionStrings__QuestionBankConnection: ${QUESTION_BANK_CONNECTION_STRING:-}

      # ── MongoDB (Atlas) ─────────────────────────────────────────────────────
      MongoDB__ConnectionString: ${MONGO_CONNECTION_STRING:-}
      MongoDB__DatabaseName: ${MONGO_DATABASE_NAME:-TechHubBoard}

      # ── RabbitMQ (CloudAMQP) ────────────────────────────────────────────────
      RabbitMQ__AmqpUrl: ${RABBITMQ_AMQP_URL:-}
      RabbitMQ__BoardBatchQueue: ${RABBITMQ_BOARD_BATCH_QUEUE:-board.batch.queue}

      # ── JWT ─────────────────────────────────────────────────────────────────
      Jwt__SecretKey: ${JWT_SECRET_KEY:-your-secret-key-here-make-it-long-and-secure}
      Jwt__Issuer: ${JWT_ISSUER:-YourApp}
      Jwt__Audience: ${JWT_AUDIENCE:-YourAppUsers}
      Jwt__ExpirationHours: ${JWT_EXPIRATION_HOURS:-24}

      # ── Cloudinary ──────────────────────────────────────────────────────────
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}

      # ── Email (ElasticEmail) ────────────────────────────────────────────────
      server: ${SMTP_SERVER:-smtp.elasticemail.com}
      Port: ${SMTP_PORT:-2525}
      smtpPassword: ${SMTP_PASSWORD:-}
      EmailSettings__Host: ${EMAIL_HOST:-smtp.elasticemail.com}
      EmailSettings__Port: ${EMAIL_PORT:-2525}
      EmailSettings__Username: ${EMAIL_USERNAME:-}
      EmailSettings__Password: ${EMAIL_PASSWORD:-}
      EmailSettings__FromEmail: ${EMAIL_FROM:-noreply@bluethub.com}
      EmailSettings__FromName: ${EMAIL_FROM_NAME:-bluetHub}

      # ── App ─────────────────────────────────────────────────────────────────
      App__BaseUrl: ${APP_BASE_URL:-http://localhost:5196}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:3000}

      # ── AI / Question Bank ──────────────────────────────────────────────────
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Anthropic__Model: ${ANTHROPIC_MODEL:-claude-2}

      # ── Supabase ────────────────────────────────────────────────────────────
      Supabase__Url: ${SUPABASE_URL:-}
      Supabase__AnonKey: ${SUPABASE_ANON_KEY:-}
      Supabase__ServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY:-}
      Supabase__Bucket: ${SUPABASE_BUCKET:-documents}
    volumes:
      - techhub-logs:/app/logs

volumes:
  techhub-logs:
